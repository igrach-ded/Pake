name: Android Compile Check

# Quick compile check for Android target.
# Runs on every push to main and PRs.
# Catches Rust compilation errors BEFORE full APK build (~5 min vs ~30 min).

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "bin/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "bin/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check-android:
    name: cargo check (Android aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.2"
          run_install: false

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run cli:build

      - name: Generate test config
        run: |
          # Create minimal .pake config for cargo check
          mkdir -p src-tauri/.pake
          cp src-tauri/tauri.conf.json src-tauri/.pake/tauri.conf.json
          cp src-tauri/pake.json src-tauri/.pake/pake.json

      - name: cargo check (Android, cli-build feature)
        timeout-minutes: 10
        run: |
          cd src-tauri
          cargo check \
            --target aarch64-linux-android \
            --features cli-build \
            --lib \
            2>&1

  check-desktop:
    name: cargo check (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.2"
          run_install: false

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run cli:build

      - name: Generate test config
        run: |
          mkdir -p src-tauri/.pake
          cp src-tauri/tauri.conf.json src-tauri/.pake/tauri.conf.json
          cp src-tauri/pake.json src-tauri/.pake/pake.json

      - name: cargo check (Desktop, cli-build feature)
        timeout-minutes: 10
        run: |
          cd src-tauri
          cargo check \
            --features cli-build \
            --lib \
            2>&1

  typescript-check:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.2"
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run cli:build

      - name: TypeScript check
        run: npx tsc --noEmit || true
